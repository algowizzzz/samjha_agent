<!DOCTYPE html>
<html>
<head>
    <title>Doc Review API Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .test { margin: 10px 0; padding: 10px; background: #2d2d2d; border-left: 3px solid #007acc; }
        .pass { border-left-color: #4ec9b0; }
        .fail { border-left-color: #f48771; }
        pre { background: #1e1e1e; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Doc Review API Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        async function testAPI(name, url, method = 'GET', body = null) {
            const div = document.createElement('div');
            div.className = 'test';
            div.innerHTML = `<strong>${name}</strong><br>Testing: ${method} ${url}<br>`;
            results.appendChild(div);
            
            try {
                const options = {
                    method,
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                };
                if (body) options.body = JSON.stringify(body);
                
                const response = await fetch(url, options);
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    data = text.substring(0, 200);
                }
                
                if (response.ok) {
                    div.className += ' pass';
                    div.innerHTML += `✓ Status: ${response.status}<br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    div.className += ' fail';
                    div.innerHTML += `✗ Status: ${response.status}<br><pre>${typeof data === 'string' ? data : JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                div.className += ' fail';
                div.innerHTML += `✗ Error: ${error.message}`;
            }
        }
        
        async function runTests() {
            await testAPI('1. List Documents', 'http://127.0.0.1:8000/api/doc_review/documents');
            await testAPI('2. List Templates', 'http://127.0.0.1:8000/api/doc_review/templates');
            await testAPI('3. VFS Tree', 'http://127.0.0.1:8000/api/doc_review/vfs/tree');
            await testAPI('4. Get Token', 'http://127.0.0.1:8000/api/doc_review/token');
        }
        
        runTests();
    </script>
</body>
</html>
