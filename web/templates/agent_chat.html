{% extends "base.html" %}
{% block title %}{{ agent_name or 'AI Agent Chat' }}{% endblock %}

{% block extra_css %}
<!-- Cache prevention meta tags - VERSION 9 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="version" content="9">
<!-- Markdown CSS for better formatting -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.2.0/github-markdown.min.css">
<!-- Markdown parser for thinking steps -->
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<style>
    /* Full screen layout - override all Bootstrap defaults */
    html {
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    body {
        overflow: hidden !important;
        height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        background-color: #f8f9fa !important;
    }
    /* Hide footer completely */
    footer.footer {
        display: none !important;
    }
    /* Make main container fill viewport minus navbar */
    main.container-fluid {
        margin: 0 !important;
        padding: 0 !important;
        flex: 1 !important;
        height: auto !important;
        min-height: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        overflow: hidden !important;
    }
    /* Override Bootstrap py-4 padding class */
    main.container-fluid.py-4 {
        padding: 0 !important;
    }
    /* Override any container constraints */
    .container, .container-fluid {
        max-width: 100% !important;
        width: 100% !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
    }
    /* Remove all margins and padding from content wrapper */
    main > div:first-child {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
    }
    /* Remove card margins and ensure full width */
    .card {
        margin: 0 !important;
        margin-bottom: 0 !important;
        width: 100% !important;
        border-radius: 0 !important;
    }
    /* Remove shadow for edge-to-edge */
    .card.shadow-sm {
        box-shadow: none !important;
    }
    
    .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 100%;
        margin: 0;
        padding: 15px;
        font-size: 14px;
        background-color: white !important;
        color: #333 !important;
    }
    /* Compact spacing for welcome message */
    .chat-message.agent .markdown-body h2 {
        margin-top: 16px;
        margin-bottom: 8px;
        font-size: 16px;
    }
    .chat-message.agent .markdown-body h2:first-of-type {
        margin-top: 8px;
    }
    .chat-message.agent .markdown-body h3 {
        margin-top: 12px;
        margin-bottom: 6px;
        font-size: 14px;
    }
    .chat-message.agent .markdown-body p {
        margin-top: 6px;
        margin-bottom: 6px;
    }
    .chat-message.agent .markdown-body ul {
        margin-top: 4px;
        margin-bottom: 8px;
    }
    .chat-message.agent .markdown-body li {
        margin-bottom: 2px;
    }
    .chat-message.agent .markdown-body blockquote {
        margin-top: 6px;
        margin-bottom: 6px;
        padding: 6px 12px;
        font-size: 13px;
    }
    .markdown-body * {
        color: #333 !important;
    }
    .markdown-body pre {
        background-color: #f6f8fa;
        border-radius: 6px;
        padding: 16px;
        overflow: auto;
        color: #333 !important;
    }
    .markdown-body code {
        background-color: rgba(175, 184, 193, 0.2);
        padding: 2px 4px;
        border-radius: 3px;
        font-size: 85%;
        color: #333 !important;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
        color: #333 !important;
    }
    .chat-message {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 12px;
        max-width: 85%;
    }
    .chat-message.user {
        background-color: #e9ecef;
        margin-left: auto;
        text-align: right;
    }
    .chat-message.agent {
        background-color: white;
        border: 1px solid #dee2e6;
        margin-right: auto;
        color: #333;
    }
    .table-container {
        position: relative;
    }
    .table-search {
        margin-bottom: 10px;
    }
    .prompt-monitor-content {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.4;
        font-size: 13px;
    }
    /* Make headers small and compact - no large headers in prompt monitor */
    .prompt-monitor-content h1, .prompt-monitor-content h2, .prompt-monitor-content h3 {
        margin-top: 8px;
        margin-bottom: 4px;
        font-weight: 600;
        font-size: 14px; /* Same size as body text */
    }
    .prompt-monitor-content h1 {
        font-size: 14px; /* h1 same as body */
    }
    .prompt-monitor-content h2 {
        font-size: 13px; /* h2 slightly smaller */
    }
    .prompt-monitor-content ul, .prompt-monitor-content ol {
        margin-top: 4px;
        margin-bottom: 4px;
        padding-left: 20px;
    }
    .prompt-monitor-content li {
        margin-bottom: 3px;
    }
    .prompt-monitor-content p {
        margin-top: 4px;
        margin-bottom: 4px;
    }
    .prompt-monitor-content code {
        background-color: #f4f4f4;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
    }
    .prompt-monitor-content strong {
        font-weight: 600;
    }
    
    /* Loading states and animations */
    .loading-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        color: #6c757d;
        font-size: 14px;
        animation: fadeIn 0.2s ease-in;
    }
    
    .typing-indicator {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        color: #6c757d;
        font-size: 13px;
        font-style: italic;
    }
    
    .typing-dots {
        display: inline-flex;
        gap: 3px;
    }
    
    .typing-dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background-color: #6c757d;
        animation: typingPulse 1.4s infinite;
    }
    
    .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }
    
    .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }
    
    /* Animations */
    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }
    
    @keyframes fadeOut {
        from {
            opacity: 1;
        }
        to {
            opacity: 0;
        }
    }
    
    @keyframes slideInDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @keyframes typingPulse {
        0%, 60%, 100% {
            opacity: 0.3;
            transform: scale(0.8);
        }
        30% {
            opacity: 1;
            transform: scale(1);
        }
    }
    
    .message-fade-in {
        animation: fadeIn 0.3s ease-in;
    }
    
    .content-smooth {
        transition: all 0.2s ease;
    }
    
    /* Error state styling */
    .error-message {
        background-color: #f8d7da;
        border-color: #f5c2c7;
        color: #842029;
    }
    
    /* Thinking panel styling */
    .thinking-panel {
        margin-top: 12px;
        margin-bottom: 8px;
    }
    
    .thinking-panel summary {
        cursor: pointer;
        color: #6c757d;
        font-size: 0.9em;
        font-weight: 500;
        padding: 6px 12px;
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        user-select: none;
    }
    
    .thinking-panel summary:hover {
        background-color: #e9ecef;
    }
    
    .thinking-panel summary::-webkit-details-marker {
        display: none;
    }
    
    .thinking-panel summary::before {
        content: '▶ ';
        display: inline-block;
        transition: transform 0.2s;
        margin-right: 4px;
    }
    
    .thinking-panel[open] summary::before {
        transform: rotate(90deg);
    }
    
    .thinking-panel .thinking-content {
        margin-top: 8px;
        padding: 12px;
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        max-height: 600px;
        overflow-y: auto;
        font-size: 0.9em;
        line-height: 1.6;
    }
    
    .thinking-panel .thinking-content h1,
    .thinking-panel .thinking-content h2,
    .thinking-panel .thinking-content h3 {
        margin-top: 16px;
        margin-bottom: 8px;
        font-weight: 600;
    }
    
    .thinking-panel .thinking-content h1 {
        font-size: 1.5em;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 4px;
    }
    
    .thinking-panel .thinking-content h2 {
        font-size: 1.3em;
    }
    
    .thinking-panel .thinking-content h3 {
        font-size: 1.1em;
    }
    
    .thinking-panel .thinking-content code {
        background-color: #f1f3f5;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: 'Courier New', monospace;
        font-size: 0.9em;
    }
    
    .thinking-panel .thinking-content pre {
        background-color: #f1f3f5;
        padding: 12px;
        border-radius: 4px;
        overflow-x: auto;
        margin: 8px 0;
    }
    
    .thinking-panel .thinking-content pre code {
        background-color: transparent;
        padding: 0;
    }
    
    .thinking-panel .thinking-content strong {
        font-weight: 600;
    }
    
    .thinking-panel pre {
        margin-top: 8px;
        padding: 12px;
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        max-height: 400px;
        overflow-y: auto;
        font-size: 0.85em;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    
    /* Mobile responsive status bar */
    @media (max-width: 768px) {
        .status-bar {
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }
        
        .status-step:not(:last-child)::after {
            display: none;
        }
    }
    
    /* Sidebar Styles */
    #chatSidebar {
        height: 100%;
        max-height: calc(100vh - 56px); /* Account for navbar */
    }
    
    #chatSidebar.collapsed {
        width: 0 !important;
        border: none !important;
        overflow: hidden;
    }
    
    .conversation-item {
        padding: 10px 12px;
        margin-bottom: 4px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
        border: 1px solid transparent;
    }
    
    .conversation-item:hover {
        background-color: #e9ecef;
    }
    
    .conversation-item.active {
        background-color: #0d6efd;
        color: white;
        border-color: #0d6efd;
    }
    
    .conversation-item.active:hover {
        background-color: #0b5ed7;
    }
    
    .conversation-title {
        font-size: 13px;
        font-weight: 500;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    
    .conversation-meta {
        font-size: 11px;
        opacity: 0.7;
        margin-top: 4px;
    }
    
    .conversation-item.active .conversation-meta {
        opacity: 0.9;
    }
    
    .conversation-group {
        margin-bottom: 16px;
    }
    
    .conversation-group-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        color: #6c757d;
        padding: 8px 12px 4px;
        margin: 0;
    }
    
    /* Header toggle button - always visible */
    #sidebarToggleHeader {
        padding: 4px 8px;
    }
    
    /* Responsive: Handle sidebar on mobile */
    @media (max-width: 768px) {
        #chatSidebar {
            position: fixed;
            left: 0;
            top: 56px;
            z-index: 1000;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
        }
        
        #chatSidebar.collapsed {
            left: -250px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="p-0 m-0" style="height: 100%; width: 100%; display: flex; flex-direction: row; margin: 0 !important; padding: 0 !important;">
    <!-- Sidebar -->
    <div id="chatSidebar" class="bg-light border-end" style="width: 250px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; transition: width 0.3s;">
        <div class="p-3 border-bottom" style="flex-shrink: 0;">
            <button id="newChatSidebarBtn" class="btn btn-primary btn-sm" style="width: 100%;">
                <i class="bi bi-plus-circle"></i> New Chat
            </button>
        </div>
        <div id="conversationList" class="flex-grow-1" style="overflow-y: auto; padding: 8px;">
            <!-- Conversations will be loaded here -->
            <div class="text-center text-muted mt-3">
                <small>Loading conversations...</small>
            </div>
        </div>
    </div>
    
    <!-- Main Chat Area -->
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div class="card shadow-sm h-100 d-flex flex-column m-0" style="border-radius: 0; border: none; height: 100%; margin: 0 !important; width: 100%;">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center" style="flex-shrink: 0;">
                <div class="d-flex align-items-center gap-2">
                    <button id="sidebarToggleHeader" class="btn btn-sm btn-light" title="Toggle sidebar">
                        <i class="bi bi-list"></i>
                    </button>
                    <h5 class="mb-0"><i class="bi bi-chat-text"></i> {{ agent_name or 'AI Agent Chat' }}</h5>
                </div>
            </div>
            <div class="card-body d-flex flex-column p-3" style="flex: 1; overflow: hidden; min-height: 0;">
                <div id="chatHistory" class="mb-3 flex-grow-1" style="overflow-y: auto; border: 1px solid #eee; padding: 12px; border-radius: 6px; background: #fafafa; min-height: 0; max-height: calc(100vh - 180px);">
                    <!-- Messages will be appended here -->
                </div>
                <div class="input-group" style="flex-shrink: 0;">
                    <input id="chatInput" type="text" class="form-control" placeholder="Ask a question or follow up..." />
                    <button id="sendBtn" class="btn btn-primary">
                        <i class="bi bi-send"></i> Send
                    </button>
                </div>
                <div class="form-check mt-2" style="flex-shrink: 0;">
                    <input class="form-check-input" type="checkbox" id="showThinkingToggle">
                    <label class="form-check-label text-muted" for="showThinkingToggle" style="font-size: 12px;">
                        Show reasoning
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Cache buster: Version 9 - Data Analysis Agents with Domain/Name fields and Auto-activation -->
<script>
    (function() {
        // CHECK VERSION FIRST - before doing anything else
        const storedVersion = localStorage.getItem('agent_chat_version');
        if (storedVersion && storedVersion !== '9') {
            console.error('%c🚨🚨🚨 VERSION ' + storedVersion + ' IN CACHE! FORCING RELOAD TO V9...', 'font-size: 20px; font-weight: bold; color: red; background: yellow; padding: 15px; border: 5px solid red;');
            // Clear ALL localStorage
            localStorage.clear();
            // Force immediate reload with cache bypass
            const url = window.location.href.split('?')[0] + '?v=9&t=' + Date.now() + '&_=' + Math.random() + '&nocache=' + Date.now();
            window.location.replace(url);
            return; // Stop execution
        }
        
        // Check if old version script already ran (window.AGENT_CHAT_VERSION exists and is not 9)
        if (window.AGENT_CHAT_VERSION && window.AGENT_CHAT_VERSION !== 9) {
            console.error('%c🚨🚨🚨 OLD SCRIPT VERSION ' + window.AGENT_CHAT_VERSION + ' DETECTED! FORCING RELOAD...', 'font-size: 20px; font-weight: bold; color: red; background: yellow; padding: 15px; border: 5px solid red;');
            localStorage.clear();
            const url = window.location.href.split('?')[0] + '?v=9&t=' + Date.now() + '&_=' + Math.random() + '&nocache=' + Date.now();
            window.location.replace(url);
            return; // Stop execution
        }
        
        const VERSION = 9;
        const BUILD_TIME = Date.now();
        
        // Check for service workers and unregister them
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                    console.log('Unregistered service worker:', registration.scope);
                }
            });
        }
        
        console.log('%c🚀🚀🚀 AGENT CHAT HTML LOADED 🚀🚀🚀', 'font-size: 16px; font-weight: bold; color: #0d6efd;');
        console.log('%cVERSION ' + VERSION + ' (Data Analysis Agents - Domain/Name + Auto-activation)', 'font-size: 16px; font-weight: bold; color: #ff0000; background: #ffff00; padding: 5px;');
        console.log('Timestamp:', new Date().toISOString());
        console.log('Build:', BUILD_TIME);
        console.log('%c⚠️ If you see VERSION 8 or earlier, your browser is caching!', 'font-size: 14px; font-weight: bold; color: red;');
        console.log('Do a hard refresh: Cmd+Shift+R (Mac) or Ctrl+Shift+R (Windows)');
        
        // Store version in window for debugging
        window.AGENT_CHAT_VERSION = VERSION;
        window.AGENT_CHAT_BUILD = BUILD_TIME;
        
        // Set version in localStorage
        localStorage.setItem('agent_chat_version', '9');
        
        // Final verification after short delay
        setTimeout(function() {
            if (window.AGENT_CHAT_VERSION !== 9) {
                console.error('%c🚨🚨🚨 FINAL CHECK FAILED! Expected 9, got ' + (window.AGENT_CHAT_VERSION || 'undefined') + ' 🚨🚨🚨', 'font-size: 18px; font-weight: bold; color: red; background: yellow; padding: 15px; border: 3px solid red;');
                localStorage.clear();
                const url = window.location.href.split('?')[0] + '?v=9&t=' + Date.now() + '&_=' + Math.random() + '&nocache=' + Date.now();
                window.location.replace(url);
            } else {
                console.log('%c✅✅✅ CORRECT VERSION 9 DETECTED! ✅✅✅', 'font-size: 14px; font-weight: bold; color: green;');
            }
        }, 100);
    })();
</script>

<script>
    // Agent Chat v5.2 - Fixed: typing indicator text bleeding into response - 2025-11-09 20:20
(function() {
    'use strict';
    // Ensure API token is available for /api/tools/execute
    const templateToken = "{{ session.token or '' }}";
    if (templateToken) {
        try {
            sessionStorage.setItem('mcp_token', templateToken);
            document.cookie = 'mcp_token=' + templateToken + '; path=/';
        } catch (e) {}
    }

    let sessionId = localStorage.getItem('agent_session_id') || '';
    if (!sessionId) {
        sessionId = 'sess-' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('agent_session_id', sessionId);
    }

    const historyEl = document.getElementById('chatHistory');
    const inputEl = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    let isQueryRunning = false;
    
    // HTTP-only mode (no WebSocket)
    let currentResponseId = null;
    let isUserScrolling = false;
    
    // ====================================================================================
    // Typing Indicator
    // ====================================================================================
    
    function showTypingIndicator(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return null;
        
        const typingId = 'typing-' + Date.now();
        const typingDiv = document.createElement('div');
        typingDiv.id = typingId;
        typingDiv.className = 'typing-indicator';
        typingDiv.innerHTML = `
            <span>Agent is thinking</span>
            <span class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </span>
        `;
        
        const markdownBody = container.querySelector('.markdown-body');
        if (markdownBody) {
            markdownBody.insertBefore(typingDiv, markdownBody.firstChild);
        }
        
        return typingId;
    }
    
    function hideTypingIndicator(typingId) {
        const typingEl = document.getElementById(typingId);
        if (!typingEl) return;
        
        typingEl.style.animation = 'fadeOut 0.2s ease-out';
        setTimeout(() => {
            if (typingEl && typingEl.parentNode) {
                typingEl.parentNode.removeChild(typingEl);
            }
        }, 200);
    }
    
    // ====================================================================================
    // PHASE 6: Smart Auto-Scroll
    // ====================================================================================
    
    function isNearBottom() {
        if (!historyEl) return true;
        const threshold = 100;
        return (historyEl.scrollHeight - historyEl.scrollTop - historyEl.clientHeight) <= threshold;
    }
    
    function smoothScrollToBottom() {
        if (!historyEl) return;
        if (!isUserScrolling || isNearBottom()) {
            requestAnimationFrame(() => {
                historyEl.scrollTo({
                    top: historyEl.scrollHeight,
                    behavior: 'smooth'
                });
            });
        }
    }
    
    // Track user scrolling
    let scrollTimeout;
    if (historyEl) {
        historyEl.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            
            // Check if user scrolled up
            if (!isNearBottom()) {
                isUserScrolling = true;
            } else {
                isUserScrolling = false;
            }
            
            // Reset after a delay
            scrollTimeout = setTimeout(() => {
                if (isNearBottom()) {
                    isUserScrolling = false;
                }
            }, 1000);
        });
    }

    // HTTP-only mode - WebSocket removed

    function escapeHtml(str) {
        if (!str) return '';
        // Convert to string first (handles objects, numbers, etc)
        const text = (typeof str === 'string') ? str : String(str);
        return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // Display SQL results table from HTTP response
    function displaySQLResults(messageEl, results) {
        if (!results || !results.columns || !results.rows) {
            return;

    function formatTable(results, tableId) {
        if (!results || !results.columns || !results.rows) {
            return 'No table data available';
        }
        
        const maxRows = 1000; // DataTables can handle more rows
        const displayRows = results.rows.slice(0, maxRows);
        
        let html = '<div class="table-container">';
        html += '<div class="table-search"><input type="text" class="form-control form-control-sm" id="search_' + tableId + '" placeholder="Search table..."></div>';
        html += '<div class="table-responsive"><table id="table_' + tableId + '" class="table table-sm table-striped table-bordered table-hover" style="width:100%">';
        
        // Header
        html += '<thead><tr>';
        results.columns.forEach(col => {
            html += '<th>' + escapeHtml(col) + '</th>';
        });
        html += '</tr></thead>';
        
        // Rows
        html += '<tbody>';
        displayRows.forEach(row => {
            html += '<tr>';
            results.columns.forEach(col => {
                const value = row[col] !== undefined ? row[col] : '';
                html += '<td>' + escapeHtml(String(value)) + '</td>';
            });
            html += '</tr>';
        });
        html += '</tbody>';
        
        html += '</table></div>';
        
        if (results.row_count > maxRows) {
            html += '<div class="small text-muted mt-2">Showing first ' + maxRows + ' of ' + results.row_count + ' rows</div>';
        } else {
            html += '<div class="small text-muted mt-2">Total: ' + results.row_count + ' rows</div>';
        }
        
        html += '</div>';
        
        // Initialize DataTable after HTML is inserted
        setTimeout(function() {
            if ($.fn.DataTable && $('#table_' + tableId).length) {
                try {
                    const tableConfig = {
                        pageLength: 25,
                        lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
                        order: [],
                        responsive: true,
                        scrollX: true
                    };
                    
                    // Add buttons if available
                    if ($.fn.dataTable.Buttons) {
                        tableConfig.dom = 'Bfrtip';
                        tableConfig.buttons = ['copy', 'csv'];
                    }
                    
                    const table = $('#table_' + tableId).DataTable(tableConfig);
                    
                    // Add search functionality
                    $('#search_' + tableId).on('keyup', function() {
                        table.search(this.value).draw();
                    });
                } catch (e) {
                    console.error('DataTable initialization error:', e);
                }
            }
        }, 200);
        
        return html;
    }

    // HTTP-only mode - no streaming chunks
    
    function finalizeMessage(messageId, result) {
        const messageEl = document.getElementById(messageId);
        if (!messageEl) return;

        // Render markdown response
        const responseEl = messageEl.querySelector('.markdown-body');
        const finalOut = (result && result.final_output) ? result.final_output : {};
        const answer = finalOut.response || '';
        
        if (responseEl && typeof marked !== 'undefined' && answer) {
            try {
                responseEl.innerHTML = marked.parse(answer);
                        } catch (e) {
                console.error('Markdown render error:', e);
                responseEl.innerHTML = '<pre>' + escapeHtml(answer) + '</pre>';
            }
        }
        
        // Store SQL for table display
        if (finalOut.sql) {
            messageEl.dataset.sql = finalOut.sql;
        }
        
        // Display SQL results table if available
        if (finalOut.results) {
            displaySQLResults(messageEl, finalOut.results);
        }

        // Optional: show Decider thinking trace if present in final_output.thinking
        try {
            const thinking = result && result.final_output ? (result.final_output.thinking || '') : '';
            console.log('[DEBUG] finalizeStreamingMessage - thinking check:', {
                hasResult: !!result,
                hasFinalOutput: !!(result && result.final_output),
                thinkingLength: thinking ? thinking.length : 0,
                thinkingTrimmed: thinking ? thinking.trim().length : 0
            });
            if (thinking && thinking.trim()) {
                console.log('[DEBUG] Rendering thinking panel, length:', thinking.length);
                const existing = messageEl.querySelector('.thinking-panel');
                if (existing) {
                    console.log('[DEBUG] Removing existing thinking panel');
                    existing.remove();
                }

                const panel = document.createElement('details');
                panel.className = 'thinking-panel';
                panel.open = false;

                const summary = document.createElement('summary');
                summary.textContent = '🧠 Thinking (Decider)';
                panel.appendChild(summary);

                // Render markdown instead of raw text
                const contentDiv = document.createElement('div');
                contentDiv.className = 'thinking-content markdown-body';
                
                // Parse markdown to HTML
                if (typeof marked !== 'undefined') {
                    // Use marked.js if available
                    contentDiv.innerHTML = marked.parse(thinking);
                } else {
                    // Fallback: simple markdown rendering for basic formatting
                    let html = thinking
                        // Headers
                        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                        // Bold
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        // Italic
                        .replace(/\*(.*?)\*/g, '<em>$1</em>')
                        // Code blocks
                        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                        // Inline code
                        .replace(/`([^`]+)`/g, '<code>$1</code>')
                        // Line breaks
                        .replace(/\n/g, '<br>');
                    contentDiv.innerHTML = html;
                }
                
                panel.appendChild(contentDiv);

                messageEl.appendChild(panel);
                console.log('[DEBUG] Thinking panel appended to messageEl');
            } else {
                console.log('[DEBUG] No thinking to display (empty or missing)');
            }
                    } catch (e) {
            console.error('[DEBUG] Failed to render thinking panel:', e);
        }

    }

    // Conversation management functions
    function groupByDate(conversations) {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const lastWeek = new Date(today);
        lastWeek.setDate(lastWeek.getDate() - 7);
        
        const groups = {
            today: [],
            yesterday: [],
            lastWeek: [],
            older: []
        };
        
        conversations.forEach(conv => {
            const convDate = new Date(conv.created_at);
            if (convDate >= today) {
                groups.today.push(conv);
            } else if (convDate >= yesterday) {
                groups.yesterday.push(conv);
            } else if (convDate >= lastWeek) {
                groups.lastWeek.push(conv);
            } else {
                groups.older.push(conv);
            }
        });
        
        return groups;
    }

    let currentEventSource = null;
    let currentRunId = null;

    function sendQuery() {
        // Re-get input element in case it wasn't available during initialization
        const input = inputEl || document.getElementById('chatInput');
        if (!input) {
            console.error('[sendQuery] chatInput element not found');
            return;
        }
        
        const q = input.value.trim();
        if (!q) return;
        const showThinking = !!document.getElementById('showThinkingToggle')?.checked;
        console.log('[DEBUG] sendQuery called:', { query: q, showThinking: showThinking });
        appendMessage('user', q);
        input.value = '';
        $('#sendBtn').prop('disabled', true);
        isQueryRunning = true;

        // Close previous SSE connection if any
        if (currentEventSource) {
            currentEventSource.close();
            currentEventSource = null;
        }

        // Create placeholder for agent response
        messageCounter++;
        currentResponseId = 'msg-' + messageCounter;
        
        const wrapper = document.createElement('div');
        wrapper.className = 'mb-3 message-fade-in';
        const messageDiv = document.createElement('div');
        messageDiv.id = currentResponseId;
        messageDiv.className = 'chat-message agent';
        messageDiv.innerHTML = '<span class="badge bg-success me-2">Agent</span><div class="markdown-body"><em>Processing...</em></div>';
        wrapper.appendChild(messageDiv);
        historyEl.appendChild(wrapper);
        
        // Smooth scroll to new message
        smoothScrollToBottom();

        // Get agent_id from route
        const agentId = {% if agent_id %}'{{ agent_id }}'{% else %}null{% endif %};
        if (!agentId) {
            console.error('No agent_id available');
            $('#sendBtn').prop('disabled', false);
            isQueryRunning = false;
            return;
        }

        // Start run via POST
        const requestData = {
            query: q,
            conversation_id: currentSessionId || null,
            show_thinking: showThinking
        };

        if (awaitingClarification) {
            requestData.user_clarification = q;
            awaitingClarification = false;
            inputEl.placeholder = 'Ask a question or provide a follow-up...';
        }

        console.log('[DEBUG] Starting run:', requestData);
        API.post(`/api/agents/${agentId}/runs`, requestData)
            .done(function(resp) {
                currentRunId = resp.run_id;
                if (resp.conversation_id) {
                    currentSessionId = resp.conversation_id;
                    localStorage.setItem('agentSessionId', currentSessionId);
                    // Refresh conversation list to show new conversation
                    loadConversationList();
                }
                
                // Open SSE stream
                const eventSource = new EventSource(`/api/runs/${currentRunId}/events`);
                currentEventSource = eventSource;
                
                let sqlGenerated = false;
                let resultsReady = false;
                const messageEl = document.getElementById(currentResponseId);
                const markdownBody = messageEl ? messageEl.querySelector('.markdown-body') : null;
                
                eventSource.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('[DEBUG] SSE event:', data);
                        
                        const eventType = data.event_type || data.payload?.event_type;
                        const payload = data.payload || {};
                        
                        switch (eventType) {
                            case 'run_started':
                                if (markdownBody) {
                                    markdownBody.innerHTML = '<em>Starting analysis...</em>';
                                }
                                break;
                                
                            case 'decider_done':
                                if (markdownBody) {
                                    markdownBody.innerHTML = '<em>Planning query...</em>';
                                }
                                break;
                                
                            case 'sql_generated':
                                sqlGenerated = true;
                                const sql = payload.sql || '';
                                if (sql && messageEl) {
                                    messageEl.dataset.sql = sql;
                                }
                                if (markdownBody) {
                                    markdownBody.innerHTML = '<em>Executing query...</em>';
                                }
                                break;
                                
                            case 'results_ready':
                                resultsReady = true;
                                const rowCount = payload.row_count || 0;
                                if (markdownBody) {
                                    markdownBody.innerHTML = `<em>Query executed (${rowCount} rows). Generating response...</em>`;
                                }
                                break;
                                
                            case 'final_response':
                                const response = payload.response || '';
                                if (markdownBody && typeof marked !== 'undefined') {
                                    markdownBody.innerHTML = marked.parse(response);
                                } else if (markdownBody) {
                                    markdownBody.innerHTML = '<div>' + escapeHtml(response) + '</div>';
                                }
                                break;
                                
                            case 'ask_user':
                                const question = payload.question || 'I need clarification.';
                                if (markdownBody && typeof marked !== 'undefined') {
                                    markdownBody.innerHTML = marked.parse(question);
                                } else if (markdownBody) {
                                    markdownBody.innerHTML = '<div>' + escapeHtml(question) + '</div>';
                                }
                                awaitingClarification = true;
                                inputEl.placeholder = 'Provide clarification...';
                                break;
                                
                            case 'run_blocked':
                                // Display blocked reason immediately
                                const blockedReason = payload.reason || 'Query was blocked.';
                                if (messageEl) {
                                    messageEl.classList.add('error-message');
                                }
                                if (markdownBody && typeof marked !== 'undefined') {
                                    markdownBody.innerHTML = '<i class="bi bi-exclamation-triangle"></i> ' + marked.parse(blockedReason);
                                } else if (markdownBody) {
                                    markdownBody.innerHTML = '<i class="bi bi-exclamation-triangle"></i> ' + escapeHtml(blockedReason);
                                }
                                eventSource.close();
                                currentEventSource = null;
                                $('#sendBtn').prop('disabled', false);
                                isQueryRunning = false;
                                currentResponseId = null;
                                break;
                                
                            case 'run_failed':
                                // Display error message immediately
                                const errorMsg = payload.error || 'An error occurred.';
                                if (messageEl) {
                                    messageEl.classList.add('error-message');
                                }
                                if (markdownBody && typeof marked !== 'undefined') {
                                    markdownBody.innerHTML = '<i class="bi bi-exclamation-triangle"></i> <strong>Error:</strong> ' + marked.parse(errorMsg);
                                } else if (markdownBody) {
                                    markdownBody.innerHTML = '<i class="bi bi-exclamation-triangle"></i> <strong>Error:</strong> ' + escapeHtml(errorMsg);
                                }
                                eventSource.close();
                                currentEventSource = null;
                                $('#sendBtn').prop('disabled', false);
                                isQueryRunning = false;
                                currentResponseId = null;
                                break;
                                
                            case 'run_completed':
                                eventSource.close();
                                currentEventSource = null;
                                
                                // Fetch final run state to get results or check for errors
                                if (currentRunId) {
                                    API.get(`/api/runs/${currentRunId}`)
                                        .done(function(runData) {
                                            // Handle error cases (blocked, error, etc.)
                                            if (runData.error_type) {
                                                const errorText = runData.result_summary || runData.error_type;
                                                if (messageEl) {
                                                    messageEl.classList.add('error-message');
                                                }
                                                if (markdownBody && typeof marked !== 'undefined') {
                                                    markdownBody.innerHTML = '<i class="bi bi-exclamation-triangle"></i> ' + marked.parse(errorText);
                                                } else if (markdownBody) {
                                                    markdownBody.innerHTML = '<i class="bi bi-exclamation-triangle"></i> ' + escapeHtml(errorText);
                                                }
                                            } else if (runData.results && messageEl) {
                                                // Display results if available (success case)
                                                displaySQLResults(messageEl, {
                                                    columns: Object.keys(runData.results.schema || {}),
                                                    rows: runData.results.rows || [],
                                                    row_count: (runData.results.rows || []).length
                                                });
                                            }
                                        })
                                        .always(function() {
                                            $('#sendBtn').prop('disabled', false);
                                            isQueryRunning = false;
                                            currentResponseId = null;
                                            // Refresh conversation list to update message counts
                                            loadConversationList();
                                        });
                                } else {
                                    $('#sendBtn').prop('disabled', false);
                                    isQueryRunning = false;
                                    currentResponseId = null;
                                    // Refresh conversation list
                                    loadConversationList();
                                }
                                break;
                        }
                        
                        smoothScrollToBottom();
                    } catch (e) {
                        console.error('Error parsing SSE event:', e);
                    }
                };
                
                eventSource.onerror = function(e) {
                    console.error('SSE error:', e);
                    if (eventSource.readyState === EventSource.CLOSED) {
                        eventSource.close();
                        currentEventSource = null;
                        $('#sendBtn').prop('disabled', false);
                        isQueryRunning = false;
                        if (markdownBody) {
                            markdownBody.innerHTML = '<i class="bi bi-exclamation-triangle"></i> Connection closed.';
                        }
                    }
                };
            })
            .fail(function(xhr) {
                const err = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error : ('HTTP ' + xhr.status);
                console.error('Error starting run:', err);
                
                if (currentResponseId) {
                    const msgEl = document.getElementById(currentResponseId);
                    if (msgEl) {
                        msgEl.classList.add('error-message');
                        const markdownBody = msgEl.querySelector('.markdown-body');
                        if (markdownBody) {
                            markdownBody.innerHTML = '<i class="bi bi-exclamation-triangle"></i> Error: ' + escapeHtml(err);
                        }
                    }
                } else {
                    appendMessage('agent', 'Error: ' + err);
                }
                awaitingClarification = false;
                inputEl.placeholder = 'Ask a question or provide a follow-up...';
                $('#sendBtn').prop('disabled', false);
                isQueryRunning = false;
                currentResponseId = null;
            });
    }

    function setupEventListeners() {

        const input = document.getElementById('chatInput');
        
        if (!btn) {
            console.error('[DEBUG] sendBtn not found! Retrying in 100ms...');
            setTimeout(setupEventListeners, 100);
            return;
                        }
                        
        if (!input) {
            console.error('[DEBUG] inputEl not found! Retrying in 100ms...');
            setTimeout(setupEventListeners, 100);
            return;
        }
        
        // Add click listener
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            sendQuery();
        });
        console.log('[DEBUG] Send button event listener attached');
        
        // Add Enter key listener
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendQuery();
            }
        });
        console.log('[DEBUG] Input keydown listener attached');
    
    // Sidebar toggle button (in header)
    const sidebarToggleHeader = document.getElementById('sidebarToggleHeader');
    const sidebar = document.getElementById('chatSidebar');
    
    function toggleSidebar() {
        if (sidebar) {
            sidebar.classList.toggle('collapsed');
        }
    }
    
    if (sidebarToggleHeader) {
        sidebarToggleHeader.addEventListener('click', toggleSidebar);
    }
    
    // New Chat button in sidebar
    const newChatSidebarBtn = document.getElementById('newChatSidebarBtn');
    if (newChatSidebarBtn) {
        newChatSidebarBtn.addEventListener('click', function() {
            startNewChat();
        });
    }
    } // Close setupEventListeners function
    
    // Load conversation list on page load (after everything is ready)
    function initializeConversationList() {
        // Wait a bit to ensure API is loaded
        if (typeof API === 'undefined' || typeof $ === 'undefined') {
            setTimeout(initializeConversationList, 100);
            return;
        }
        try {
            loadConversationList();
        } catch (e) {
            console.error('[ConversationList] Error initializing:', e);
        }
    }
    
    // Initialize everything when DOM is ready
    function initializePage() {
        try {
            setupEventListeners();
            initializeConversationList();
        } catch (e) {
            console.error('[Init] Error during page initialization:', e);
        }
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializePage);
    } else {
        // DOM already ready - wait a tiny bit to ensure all scripts are loaded
        setTimeout(initializePage, 0);
    }
    
    // v1: no agent-management controls.
})();
</script>
{% endblock %}
